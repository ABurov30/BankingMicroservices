spring.config.import=optional:file:./.env[.properties],optional:file:./AccountService/.env[.properties]

spring.application.name=${ACCOUNT_NAME}
server.port=${ACCOUNT_PORT}
grpc.server.port=${ACCOUNT_GRPC_PORT}

management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.probes.enabled=true
management.metrics.tags.application=${spring.application.name}
management.tracing.sampling.probability=${TRACING_SAMPLING_PROBABILITY:1.0}
management.opentelemetry.tracing.export.otlp.endpoint=${OTLP_TRACING_ENDPOINT:http://localhost:4318/v1/traces}

logging.pattern.correlation=[${spring.application.name:},%X{traceId:-},%X{spanId:-}]
logging.include-application-name=false

spring.datasource.url=${ACCOUNT_SPRING_DATASOURCE_URL}
spring.datasource.username=${ACCOUNT_SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${ACCOUNT_SPRING_DATASOURCE_PASSWORD}

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS}

spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=io.confluent.kafka.serializers.KafkaAvroSerializer
spring.kafka.producer.properties.schema.registry.url=${SCHEMA_REGISTRY_URL}

spring.kafka.consumer.group-id=account-service
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=io.confluent.kafka.serializers.KafkaAvroDeserializer
spring.kafka.consumer.properties.schema.registry.url=${SCHEMA_REGISTRY_URL}
spring.kafka.consumer.properties.specific.avro.reader=true

# Shared outbox settings (milliseconds). Production polling must be sized from metrics.
banking.outbox.poll-interval-ms=${BANKING_OUTBOX_POLL_INTERVAL_MS:5000}
banking.outbox.initial-delay-ms=${BANKING_OUTBOX_INITIAL_DELAY_MS:5000}
banking.outbox.batch-size=${BANKING_OUTBOX_BATCH_SIZE:50}
banking.outbox.max-in-flight=${BANKING_OUTBOX_MAX_IN_FLIGHT:50}
banking.outbox.lease-timeout-ms=${BANKING_OUTBOX_LEASE_TIMEOUT_MS:360000}
banking.outbox.retry-delay-ms=${BANKING_OUTBOX_RETRY_DELAY_MS:5000}
banking.outbox.max-attempts=${BANKING_OUTBOX_MAX_ATTEMPTS:5}
spring.kafka.producer.properties.max.block.ms=${KAFKA_PRODUCER_MAX_BLOCK_MS:5000}
spring.kafka.producer.properties.delivery.timeout.ms=${KAFKA_PRODUCER_DELIVERY_TIMEOUT_MS:30000}
spring.kafka.producer.properties.request.timeout.ms=${KAFKA_PRODUCER_REQUEST_TIMEOUT_MS:10000}
