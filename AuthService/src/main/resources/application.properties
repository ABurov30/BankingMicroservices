spring.config.import=optional:file:./.env[.properties],optional:file:./AuthService/.env[.properties]

spring.application.name=${AUTH_NAME}
server.port=${AUTH_PORT}
grpc.server.port=${AUTH_GRPC_PORT}

spring.datasource.url=${AUTH_SPRING_DATASOURCE_URL}
spring.datasource.username=${AUTH_SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${AUTH_SPRING_DATASOURCE_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate

spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml


jwt.issuer=auth-service
jwt.audience=bank-api
jwt.access-token-ttl-minutes=15
jwt.refresh-token-ttl-day=30
jwt.private-key-location=file:${JWT_PRIVATE_KEY_PATH}
jwt.public-key-location=file:${JWT_PUBLIC_KEY_PATH}
