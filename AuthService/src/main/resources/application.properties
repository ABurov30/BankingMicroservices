spring.config.import=optional:file:./.env[.properties],optional:file:./AuthService/.env[.properties]

spring.application.name=${AUTH_NAME}
server.port=${AUTH_PORT}
grpc.server.port=${AUTH_GRPC_PORT}

management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.probes.enabled=true
management.metrics.tags.application=${spring.application.name}
management.tracing.sampling.probability=${TRACING_SAMPLING_PROBABILITY:1.0}
management.opentelemetry.tracing.export.otlp.endpoint=${OTLP_TRACING_ENDPOINT:http://localhost:4318/v1/traces}

logging.pattern.correlation=[${spring.application.name:},%X{traceId:-},%X{spanId:-}]
logging.include-application-name=false

spring.datasource.url=${AUTH_SPRING_DATASOURCE_URL}
spring.datasource.username=${AUTH_SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${AUTH_SPRING_DATASOURCE_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate

spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml

jwt.issuer=auth-service
jwt.audience=bank-api
jwt.access-token-ttl-minutes=15
jwt.refresh-token-ttl-days=30
jwt.private-key-location=file:${JWT_PRIVATE_KEY_PATH}
jwt.public-key-location=file:${JWT_PUBLIC_KEY_PATH}

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS}

spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=io.confluent.kafka.serializers.KafkaAvroSerializer
spring.kafka.producer.properties.schema.registry.url=${SCHEMA_REGISTRY_URL}

spring.kafka.consumer.group-id=auth-service
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=io.confluent.kafka.serializers.KafkaAvroDeserializer
spring.kafka.consumer.properties.schema.registry.url=${SCHEMA_REGISTRY_URL}
spring.kafka.consumer.properties.specific.avro.reader=true
