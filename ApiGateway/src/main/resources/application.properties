spring.config.import=optional:file:./${ENV_FILE:.env.local}[.properties],optional:file:./ApiGateway/${ENV_FILE:.env.local}[.properties]
site.url=${SITE_URL}
auth.cookie.domain=${AUTH_COOKIE_DOMAIN:}
auth.cookie.same-site=${AUTH_COOKIE_SAME_SITE:Strict}
auth.cookie.secure=${AUTH_COOKIE_SECURE:true}
spring.application.name=${API_GATEWAY_NAME}
server.port=${API_GATEWAY_PORT}
server.servlet.session.cookie.same-site=lax
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.probes.enabled=true
management.metrics.tags.application=${spring.application.name}
management.tracing.sampling.probability=${TRACING_SAMPLING_PROBABILITY:1.0}
management.opentelemetry.tracing.export.otlp.endpoint=${OTLP_TRACING_ENDPOINT:http://localhost:4318/v1/traces}
logging.pattern.correlation=[${spring.application.name:},%X{traceId:-},%X{spanId:-}]
logging.include-application-name=false
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS}
spring.kafka.consumer.group-id=api-gateway
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=io.confluent.kafka.serializers.KafkaAvroDeserializer
spring.kafka.consumer.properties.schema.registry.url=${SCHEMA_REGISTRY_URL}
spring.kafka.consumer.properties.specific.avro.reader=true
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.connect-timeout=${REDIS_CONNECT_TIMEOUT:200ms}
rate-limit.enabled=${RATE_LIMIT_ENABLED:true}
rate-limit.default-limit.limit=${RATE_LIMIT_DEFAULT_LIMIT:120}
rate-limit.default-limit.window-seconds=${RATE_LIMIT_DEFAULT_WINDOW_SECONDS:60}
rate-limit.auth.limit=${RATE_LIMIT_AUTH_LIMIT:5}
rate-limit.auth.window-seconds=${RATE_LIMIT_AUTH_WINDOW_SECONDS:60}
rate-limit.transaction.limit=${RATE_LIMIT_TRANSACTION_LIMIT:10}
rate-limit.transaction.window-seconds=${RATE_LIMIT_TRANSACTION_WINDOW_SECONDS:60}
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=openid,email,profile
spring.security.oauth2.client.registration.google.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}
# Per-dependency overrides: grpc.resilience.instances.<dependency>.<property>
grpc.resilience.defaults.window-type=COUNT_BASED
grpc.resilience.defaults.window-size=20
grpc.resilience.defaults.minimum-calls=10
grpc.resilience.defaults.failure-rate-threshold=50
grpc.resilience.defaults.slow-call-rate-threshold=50
grpc.resilience.defaults.slow-call-duration-ms=1500
grpc.resilience.defaults.open-wait-ms=10000
grpc.resilience.defaults.half-open-calls=3
grpc.resilience.defaults.record-resource-exhausted=false
# Total attempts, within the existing RPC deadline. Only allowlisted unary reads retry.
grpc.resilience.defaults.retry.max-attempts=2
grpc.resilience.defaults.retry.initial-backoff-ms=100
grpc.resilience.defaults.retry.max-backoff-ms=500
grpc.resilience.defaults.retry.backoff-multiplier=2
grpc.resilience.defaults.half-open-max-wait-ms=5000
# Per-replica semaphore limits. Admission is strictly fail-fast (wait must be zero).
grpc.resilience.defaults.bulkhead.max-concurrent-calls=8
grpc.resilience.defaults.bulkhead.max-wait-duration-ms=0
# Active streams have a separate permit pool held until terminal close/cancellation.
grpc.resilience.defaults.bulkhead.stream.max-concurrent-calls=32
grpc.resilience.defaults.bulkhead.stream.max-wait-duration-ms=0
account.overview.cache.enabled=${ACCOUNT_OVERVIEW_CACHE_ENABLED:true}
account.overview.cache.l1-ttl=${ACCOUNT_OVERVIEW_CACHE_L1_TTL:2s}
account.overview.cache.l2-ttl=${ACCOUNT_OVERVIEW_CACHE_L2_TTL:5s}
account.overview.cache.l1-max-size=${ACCOUNT_OVERVIEW_CACHE_L1_MAX_SIZE:10000}
