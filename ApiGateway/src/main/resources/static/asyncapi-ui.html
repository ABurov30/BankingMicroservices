<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bank API Gateway AsyncAPI</title>
    <link
      rel="stylesheet"
      href="https://unpkg.com/@asyncapi/react-component@3.1.4/styles/default.min.css">
    <style>
      body {
        margin: 0;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #ffffff;
      }

      .asyncapi-loading,
      .asyncapi-error {
        padding: 24px;
        font-size: 16px;
      }

      .asyncapi-error {
        color: #b91c1c;
      }
    </style>
  </head>
  <body>
    <div id="asyncapi" class="asyncapi-loading">Loading AsyncAPI documentation...</div>
    <script src="https://unpkg.com/@asyncapi/react-component@3.1.4/browser/standalone/index.js"></script>
    <script>
      fetch('/asyncapi.yaml')
        .then((response) => {
          if (!response.ok) {
            throw new Error('Cannot load /asyncapi.yaml: HTTP ' + response.status);
          }
          return response.text();
        })
        .then((schema) => {
          AsyncApiStandalone.render(
            {
              schema: schema,
              config: {
                show: {
                  sidebar: true
                }
              }
            },
            document.getElementById('asyncapi')
          );
        })
        .catch((error) => {
          var container = document.getElementById('asyncapi');
          container.className = 'asyncapi-error';
          container.textContent = error.message;
        });
    </script>
  </body>
</html>
