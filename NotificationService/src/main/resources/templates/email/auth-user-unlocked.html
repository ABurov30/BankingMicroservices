<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Account unlocked</title>
</head>
<body style="margin:0;padding:0;background:#120d25;font-family:Manrope,Arial,sans-serif;color:#f4f1fc;">
<table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background:#120d25;padding:32px 16px;">
    <tr>
        <td align="center">
            <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:560px;background:#1f1738;border:1px solid #2c2252;border-radius:18px;overflow:hidden;">
                <tr>
                    <td style="padding:28px 28px 18px;">
                        <table role="presentation" width="100%" cellspacing="0" cellpadding="0">
                            <tr>
                                <td>
                                    <span style="display:inline-block;width:30px;height:30px;background:#ff5480;border-radius:15px;vertical-align:middle;"></span>
                                    <span style="font-family:Sora,Manrope,Arial,sans-serif;font-weight:800;font-size:20px;color:#f4f1fc;margin-left:10px;vertical-align:middle;">buro</span>
                                </td>
                                <td align="right" style="font-size:11px;font-weight:700;letter-spacing:1px;color:#a79fcb;text-transform:uppercase;">Security</td>
                            </tr>
                        </table>
                    </td>
                </tr>
                <tr>
                    <td style="padding:8px 28px 28px;">
                        <div style="background:linear-gradient(135deg,#1f1738 0%,#2a2148 48%,#123f2d 100%);border:1px solid #2c2252;border-radius:18px;padding:28px;">
                            <span style="display:inline-block;background:#123f2d;color:#34c27b;border-radius:999px;padding:6px 11px;font-size:11px;font-weight:800;letter-spacing:.5px;margin-bottom:18px;">ACTIVE</span>
                            <h1 style="margin:0 0 12px;font-family:Sora,Manrope,Arial,sans-serif;font-size:30px;line-height:1.15;color:#f4f1fc;">Account unlocked</h1>
                            <p style="margin:0;font-size:15px;line-height:1.65;color:#c8c2e4;">
                                Access has been restored. You can use the app again and manage your accounts and cards.
                            </p>
                        </div>
                    </td>
                </tr>
                <tr>
                    <td style="padding:0 28px 30px;">
                        <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background:#231a44;border:1px solid #2c2252;border-radius:14px;">
                            <tr>
                                <td style="padding:18px 20px;">
                                    <div style="font-size:12px;font-weight:700;color:#8e84bc;margin-bottom:6px;">Email</div>
                                    <div style="font-size:15px;font-weight:700;color:#f4f1fc;" th:text="${email}">user@example.com</div>
                                </td>
                                <td align="right" style="padding:18px 20px;">
                                    <span style="display:inline-block;background:#2a2148;color:#ffc44a;border-radius:999px;padding:5px 10px;font-size:11px;font-weight:800;letter-spacing:.4px;">CHECK ACCESS</span>
                                </td>
                            </tr>
                        </table>
                        <p style="margin:20px 0 0;font-size:12px;line-height:1.6;color:#7a6fa8;">
                            If you did not expect your account to be unlocked, review your account security and contact support.
                        </p>
                    </td>
                </tr>
            </table>
        </td>
    </tr>
</table>
</body>
</html>
