spring.config.import=optional:file:./.env[.properties],optional:file:./TransactionService/.env[.properties]

spring.application.name=${TRANSACTION_NAME}
server.port=${TRANSACTION_PORT}
grpc.server.port=${TRANSACTION_GRPC_PORT}

management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.probes.enabled=true
management.metrics.tags.application=${spring.application.name}
management.tracing.sampling.probability=${TRACING_SAMPLING_PROBABILITY:1.0}
management.opentelemetry.tracing.export.otlp.endpoint=${OTLP_TRACING_ENDPOINT:http://localhost:4318/v1/traces}

logging.pattern.correlation=[${spring.application.name:},%X{traceId:-},%X{spanId:-}]
logging.include-application-name=false

spring.datasource.url=${TRANSACTION_SPRING_DATASOURCE_URL}
spring.datasource.username=${TRANSACTION_SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${TRANSACTION_SPRING_DATASOURCE_PASSWORD}

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS}

spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=io.confluent.kafka.serializers.KafkaAvroSerializer
spring.kafka.producer.properties.schema.registry.url=${SCHEMA_REGISTRY_URL}

spring.kafka.consumer.group-id=transaction-service
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=io.confluent.kafka.serializers.KafkaAvroDeserializer
spring.kafka.consumer.properties.schema.registry.url=${SCHEMA_REGISTRY_URL}
spring.kafka.consumer.properties.specific.avro.reader=true

# Per-dependency overrides: grpc.resilience.instances.<dependency>.<property>
grpc.resilience.defaults.window-type=COUNT_BASED
grpc.resilience.defaults.window-size=20
grpc.resilience.defaults.minimum-calls=10
grpc.resilience.defaults.failure-rate-threshold=50
grpc.resilience.defaults.slow-call-rate-threshold=50
grpc.resilience.defaults.slow-call-duration-ms=1500
grpc.resilience.defaults.open-wait-ms=10000
grpc.resilience.defaults.half-open-calls=3
grpc.resilience.defaults.record-resource-exhausted=false
# Total attempts, within the existing RPC deadline. Only allowlisted unary reads retry.
grpc.resilience.defaults.retry.max-attempts=2
grpc.resilience.defaults.retry.initial-backoff-ms=100
grpc.resilience.defaults.retry.max-backoff-ms=500
grpc.resilience.defaults.retry.backoff-multiplier=2
grpc.resilience.defaults.half-open-max-wait-ms=5000

# Per-replica semaphore limits. Admission is strictly fail-fast (wait must be zero).
grpc.resilience.defaults.bulkhead.max-concurrent-calls=8
grpc.resilience.defaults.bulkhead.max-wait-duration-ms=0
# Active streams have a separate permit pool held until terminal close/cancellation.
grpc.resilience.defaults.bulkhead.stream.max-concurrent-calls=32
grpc.resilience.defaults.bulkhead.stream.max-wait-duration-ms=0

# Shared outbox settings (milliseconds). Production polling must be sized from metrics.
banking.outbox.poll-interval-ms=${BANKING_OUTBOX_POLL_INTERVAL_MS:5000}
banking.outbox.initial-delay-ms=${BANKING_OUTBOX_INITIAL_DELAY_MS:5000}
banking.outbox.batch-size=${BANKING_OUTBOX_BATCH_SIZE:50}
banking.outbox.max-in-flight=${BANKING_OUTBOX_MAX_IN_FLIGHT:50}
banking.outbox.lease-timeout-ms=${BANKING_OUTBOX_LEASE_TIMEOUT_MS:360000}
banking.outbox.retry-delay-ms=${BANKING_OUTBOX_RETRY_DELAY_MS:5000}
banking.outbox.max-attempts=${BANKING_OUTBOX_MAX_ATTEMPTS:5}
spring.kafka.producer.properties.max.block.ms=${KAFKA_PRODUCER_MAX_BLOCK_MS:5000}
spring.kafka.producer.properties.delivery.timeout.ms=${KAFKA_PRODUCER_DELIVERY_TIMEOUT_MS:30000}
spring.kafka.producer.properties.request.timeout.ms=${KAFKA_PRODUCER_REQUEST_TIMEOUT_MS:10000}
