{{- range $key, $svc := .Values.services }}
{{- if $svc.postgres }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $key }}-postgres-secret
type: Opaque
stringData:
  POSTGRES_DB: {{ $svc.postgres.db | quote }}
  POSTGRES_USER: {{ $svc.postgres.user | quote }}
  POSTGRES_PASSWORD: {{ $svc.postgres.password | quote }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ $key }}-postgres-data
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ $.Values.postgres.storage }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $svc.postgres.host }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ $svc.postgres.host }}
  template:
    metadata:
      labels:
        app: {{ $svc.postgres.host }}
    spec:
      containers:
        - name: postgres
          image: {{ $.Values.postgres.image }}
          ports:
            - name: postgres
              containerPort: 5432
          envFrom:
            - secretRef:
                name: {{ $key }}-postgres-secret
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ $key }}-postgres-data
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $svc.postgres.host }}
spec:
  selector:
    app: {{ $svc.postgres.host }}
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
{{- end }}
{{- end }}
