{{- range $key, $svc := .Values.global.services }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $svc.name }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ $svc.name }}
  template:
    metadata:
      labels:
        app: {{ $svc.name }}
    spec:
      containers:
        - name: {{ $svc.name }}
          image: "{{ index $.Values.images $key }}:{{ $.Values.global.imageTag }}"
          imagePullPolicy: {{ $.Values.global.imagePullPolicy }}
          ports:
            - name: http
              containerPort: {{ $svc.port }}
            - name: grpc
              containerPort: {{ $svc.grpcPort }}
          env:
            - name: {{ upper $key }}_NAME
              value: {{ $svc.name | quote }}
            - name: {{ upper $key }}_PORT
              value: {{ $svc.port | quote }}
            - name: {{ upper $key }}_GRPC_PORT
              value: {{ $svc.grpcPort | quote }}
{{- if eq $key "notification" }}
            - name: SITE_URL
              value: {{ $.Values.global.siteUrl | quote }}
{{- end }}
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: {{ $.Values.global.kafka.bootstrapServers | quote }}
            - name: SCHEMA_REGISTRY_URL
              value: {{ $.Values.global.kafka.schemaRegistryUrl | quote }}
{{- if $.Values.global.jaeger.enabled }}
            - name: TRACING_SAMPLING_PROBABILITY
              value: {{ $.Values.global.jaeger.tracing.samplingProbability | quote }}
            - name: OTLP_TRACING_ENDPOINT
              value: "http://{{ $.Values.global.jaeger.name }}:{{ $.Values.global.jaeger.otlpHttpPort }}/v1/traces"
            - name: MANAGEMENT_OTLP_METRICS_EXPORT_ENABLED
              value: {{ $.Values.global.jaeger.tracing.metricsExportEnabled | quote }}
{{- end }}
{{- if $svc.postgres }}
            - name: SPRING_DATASOURCE_URL
              value: "jdbc:postgresql://{{ $svc.postgres.host }}:5432/{{ $svc.postgres.db }}"
            - name: SPRING_DATASOURCE_USERNAME
              value: {{ $svc.postgres.user | quote }}
            - name: SPRING_DATASOURCE_PASSWORD
              value: {{ $svc.postgres.password | quote }}
{{- end }}
{{- if eq $key "auth" }}
            - name: JWT_PRIVATE_KEY_PATH
              value: {{ $.Values.global.jwt.privateKeyPath | quote }}
            - name: JWT_PUBLIC_KEY_PATH
              value: {{ $.Values.global.jwt.publicKeyPath | quote }}
            - name: AUTH_BOOTSTRAP_ADMIN_ENABLED
              value: {{ $svc.bootstrap.adminEnabled | quote }}
            - name: AUTH_BOOTSTRAP_ADMIN_EMAIL
              value: {{ $svc.bootstrap.adminEmail | quote }}
            - name: AUTH_BOOTSTRAP_ADMIN_PASSWORD
              value: {{ $svc.bootstrap.adminPassword | quote }}
{{- end }}
{{- if eq $key "transaction" }}
            - name: CARD_GRPC_HOST
              value: {{ $.Values.global.services.card.name | quote }}
            - name: CARD_GRPC_PORT
              value: {{ $.Values.global.services.card.grpcPort | quote }}
            - name: ACCOUNT_GRPC_HOST
              value: {{ $.Values.global.services.account.name | quote }}
            - name: ACCOUNT_GRPC_PORT
              value: {{ $.Values.global.services.account.grpcPort | quote }}
{{- end }}
{{- if $svc.mongo }}
            - name: NOTIFICATION_MONGO_URI
{{- if $svc.mongo.uri }}
              value: {{ $svc.mongo.uri | quote }}
{{- else }}
              value: "mongodb://{{ $svc.mongo.user }}:{{ $svc.mongo.password }}@{{ $svc.mongo.host }}:{{ $svc.mongo.port }}/{{ $svc.mongo.db }}?authSource=admin"
{{- end }}
            - name: MAIL_HOST
              value: {{ $svc.mail.host | quote }}
            - name: MAIL_PORT
              value: {{ $svc.mail.port | quote }}
            - name: MAIL_USERNAME
              value: {{ $svc.mail.username | quote }}
            - name: MAIL_PASSWORD
              value: {{ $svc.mail.password | quote }}
{{- end }}
{{- if eq $key "auth" }}
          volumeMounts:
            - name: jwt-keys
              mountPath: /secrets
              readOnly: true
{{- end }}
{{- if eq $key "auth" }}
      volumes:
        - name: jwt-keys
          secret:
            secretName: {{ $.Values.global.jwt.secretName }}
{{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $svc.name }}
spec:
  selector:
    app: {{ $svc.name }}
  ports:
    - name: http
      port: {{ $svc.port }}
      targetPort: http
    - name: grpc
      port: {{ $svc.grpcPort }}
      targetPort: grpc
{{- end }}
