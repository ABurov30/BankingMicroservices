services:
  kafka:
    image: apache/kafka:3.7.0
    container_name: kafka
    ports:
      - "${KAFKA_CONTAINER_PORT}:${KAFKA_CONTAINER_PORT}"
      - "${KAFKA_LOCAL_PORT}:${KAFKA_LOCAL_PORT}"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:${KAFKA_CONTROLLER_PORT}"
      KAFKA_LISTENERS: "PLAINTEXT://0.0.0.0:${KAFKA_CONTAINER_PORT},CONTROLLER://0.0.0.0:${KAFKA_CONTROLLER_PORT},PLAINTEXT_HOST://0.0.0.0:${KAFKA_LOCAL_PORT}"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:${KAFKA_CONTAINER_PORT},PLAINTEXT_HOST://localhost:${KAFKA_LOCAL_PORT}"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    ports:
      - "${KAFKA_UI_PORT}:8080"
    depends_on:
      - kafka
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: "kafka:${KAFKA_CONTAINER_PORT}"

  auth-postgres:
    image: postgres:16
    container_name: auth-postgres
    environment:
      POSTGRES_DB: ${AUTH_POSTGRES_DB}
      POSTGRES_USER: ${AUTH_POSTGRES_USER}
      POSTGRES_PASSWORD: ${AUTH_POSTGRES_PASSWORD}
    ports:
      - "${AUTH_POSTGRES_PORT}:5432"
    volumes:
      - auth_postgres_data:/var/lib/postgresql/data

  auth-service:
    image: auth-service:${IMAGE_TAG:-dev}
    build:
      context: ../AuthService
      args:
        GITHUB_TOKEN: ${GITHUB_TOKEN}
        PORT: ${AUTH_PORT}
    container_name: auth-service
    ports:
      - "${AUTH_PORT}:${AUTH_PORT}"
    depends_on:
      - auth-postgres
      - kafka
    environment:
      AUTH_NAME: ${AUTH_NAME}
      AUTH_PORT: ${AUTH_PORT}
      AUTH_GRPC_PORT: ${AUTH_GRPC_PORT}
      SPRING_DATASOURCE_URL: ${AUTH_SPRING_DATASOURCE_URL}
      SPRING_DATASOURCE_USERNAME: ${AUTH_SPRING_DATASOURCE_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${AUTH_SPRING_DATASOURCE_PASSWORD}
      JWT_PRIVATE_KEY_PATH: ${JWT_PRIVATE_KEY_PATH}
      JWT_PUBLIC_KEY_PATH: ${JWT_PUBLIC_KEY_PATH}
    volumes:
      - ./secrets/private.pem:${JWT_PRIVATE_KEY_PATH}:ro
      - ./secrets/public.pem:${JWT_PUBLIC_KEY_PATH}:ro

  user-postgres:
    image: postgres:16
    container_name: user-postgres
    environment:
      POSTGRES_DB: ${USER_POSTGRES_DB}
      POSTGRES_USER: ${USER_POSTGRES_USER}
      POSTGRES_PASSWORD: ${USER_POSTGRES_PASSWORD}
    ports:
      - "${USER_POSTGRES_PORT}:5432"
    volumes:
      - user_postgres_data:/var/lib/postgresql/data

  user-service:
    image: user-service:${IMAGE_TAG:-dev}
    build:
      context: ../UserService
      args:
        GITHUB_TOKEN: ${GITHUB_TOKEN}
        PORT: ${USER_PORT}
    container_name: user-service
    ports:
      - "${USER_PORT}:${USER_PORT}"
    depends_on:
      - user-postgres
      - kafka
    environment:
      USER_NAME: ${USER_NAME}
      USER_PORT: ${USER_PORT}
      USER_GRPC_PORT: ${USER_GRPC_PORT}
      SPRING_DATASOURCE_URL: ${USER_SPRING_DATASOURCE_URL}
      SPRING_DATASOURCE_USERNAME: ${USER_SPRING_DATASOURCE_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${USER_SPRING_DATASOURCE_PASSWORD}

  account-postgres:
    image: postgres:16
    container_name: account-postgres
    environment:
      POSTGRES_DB: ${ACCOUNT_POSTGRES_DB}
      POSTGRES_USER: ${ACCOUNT_POSTGRES_USER}
      POSTGRES_PASSWORD: ${ACCOUNT_POSTGRES_PASSWORD}
    ports:
      - "${ACCOUNT_POSTGRES_PORT}:5432"
    volumes:
      - account_postgres_data:/var/lib/postgresql/data

  account-service:
    image: account-service:${IMAGE_TAG:-dev}
    build:
      context: ../AccountService
      args:
        GITHUB_TOKEN: ${GITHUB_TOKEN}
        PORT: ${ACCOUNT_PORT}
    container_name: account-service
    ports:
      - "${ACCOUNT_PORT}:${ACCOUNT_PORT}"
    depends_on:
      - account-postgres
      - kafka
    environment:
      ACCOUNT_NAME: ${ACCOUNT_NAME}
      ACCOUNT_PORT: ${ACCOUNT_PORT}
      ACCOUNT_GRPC_PORT: ${ACCOUNT_GRPC_PORT}
      SPRING_DATASOURCE_URL: ${ACCOUNT_SPRING_DATASOURCE_URL}
      SPRING_DATASOURCE_USERNAME: ${ACCOUNT_SPRING_DATASOURCE_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${ACCOUNT_SPRING_DATASOURCE_PASSWORD}

  card-postgres:
    image: postgres:16
    container_name: card-postgres
    environment:
      POSTGRES_DB: ${CARD_POSTGRES_DB}
      POSTGRES_USER: ${CARD_POSTGRES_USER}
      POSTGRES_PASSWORD: ${CARD_POSTGRES_PASSWORD}
    ports:
      - "${CARD_POSTGRES_PORT}:5432"
    volumes:
      - card_postgres_data:/var/lib/postgresql/data

  card-service:
    image: card-service:${IMAGE_TAG:-dev}
    build:
      context: ../CardService
      args:
        GITHUB_TOKEN: ${GITHUB_TOKEN}
        PORT: ${CARD_PORT}
    container_name: card-service
    ports:
      - "${CARD_PORT}:${CARD_PORT}"
    depends_on:
      - card-postgres
      - kafka
    environment:
      CARD_NAME: ${CARD_NAME}
      CARD_PORT: ${CARD_PORT}
      CARD_GRPC_PORT: ${CARD_GRPC_PORT}
      SPRING_DATASOURCE_URL: ${CARD_SPRING_DATASOURCE_URL}
      SPRING_DATASOURCE_USERNAME: ${CARD_SPRING_DATASOURCE_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${CARD_SPRING_DATASOURCE_PASSWORD}

  transaction-postgres:
    image: postgres:16
    container_name: transaction-postgres
    environment:
      POSTGRES_DB: ${TRANSACTION_POSTGRES_DB}
      POSTGRES_USER: ${TRANSACTION_POSTGRES_USER}
      POSTGRES_PASSWORD: ${TRANSACTION_POSTGRES_PASSWORD}
    ports:
      - "${TRANSACTION_POSTGRES_PORT}:5432"
    volumes:
      - transaction_postgres_data:/var/lib/postgresql/data

  transaction-service:
    image: transaction-service:${IMAGE_TAG:-dev}
    build:
      context: ../TransactionService
      args:
        GITHUB_TOKEN: ${GITHUB_TOKEN}
        PORT: ${TRANSACTION_PORT}
    container_name: transaction-service
    ports:
      - "${TRANSACTION_PORT}:${TRANSACTION_PORT}"
    depends_on:
      - transaction-postgres
      - kafka
    environment:
      TRANSACTION_NAME: ${TRANSACTION_NAME}
      TRANSACTION_PORT: ${TRANSACTION_PORT}
      TRANSACTION_GRPC_PORT: ${TRANSACTION_GRPC_PORT}
      SPRING_DATASOURCE_URL: ${TRANSACTION_SPRING_DATASOURCE_URL}
      SPRING_DATASOURCE_USERNAME: ${TRANSACTION_SPRING_DATASOURCE_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${TRANSACTION_SPRING_DATASOURCE_PASSWORD}

  notification-mongodb:
    image: mongo:7
    container_name: notification-mongodb
    environment:
      MONGO_INITDB_DATABASE: ${NOTIFICATION_MONGO_DB}
      MONGO_INITDB_ROOT_USERNAME: ${NOTIFICATION_MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${NOTIFICATION_MONGO_PASSWORD}
    ports:
      - "${NOTIFICATION_MONGO_PORT}:27017"
    volumes:
      - notification_mongo_data:/data/db

  notification-service:
    image: notification-service:${IMAGE_TAG:-dev}
    build:
      context: ../NotificationService
      args:
        GITHUB_TOKEN: ${GITHUB_TOKEN}
        PORT: ${NOTIFICATION_PORT}
    container_name: notification-service
    ports:
      - "${NOTIFICATION_PORT}:${NOTIFICATION_PORT}"
    depends_on:
      - notification-mongodb
      - kafka
    environment:
      NOTIFICATION_NAME: ${NOTIFICATION_NAME}
      NOTIFICATION_PORT: ${NOTIFICATION_PORT}
      NOTIFICATION_GRPC_PORT: ${NOTIFICATION_GRPC_PORT}
      NOTIFICATION_MONGO_URI: ${NOTIFICATION_MONGO_URI}

  api-gateway:
    image: api-gateway:${IMAGE_TAG:-dev}
    build:
      context: ../ApiGateway
      args:
        GITHUB_TOKEN: ${GITHUB_TOKEN}
        PORT: ${API_GATEWAY_PORT}
    container_name: api-gateway
    ports:
      - "${API_GATEWAY_PORT}:${API_GATEWAY_PORT}"
    depends_on:
      - auth-service
      - user-service
      - account-service
      - card-service
      - transaction-service
      - notification-service
    environment:
      API_GATEWAY_NAME: ${API_GATEWAY_NAME}
      API_GATEWAY_PORT: ${API_GATEWAY_PORT}
      AUTH_GRPC_HOST: ${AUTH_GRPC_HOST}
      AUTH_GRPC_PORT: ${AUTH_GRPC_PORT}
      USER_GRPC_HOST: ${USER_GRPC_HOST}
      USER_GRPC_PORT: ${USER_GRPC_PORT}
      ACCOUNT_GRPC_HOST: ${ACCOUNT_GRPC_HOST}
      ACCOUNT_GRPC_PORT: ${ACCOUNT_GRPC_PORT}
      CARD_GRPC_HOST: ${CARD_GRPC_HOST}
      CARD_GRPC_PORT: ${CARD_GRPC_PORT}
      TRANSACTION_GRPC_HOST: ${TRANSACTION_GRPC_HOST}
      TRANSACTION_GRPC_PORT: ${TRANSACTION_GRPC_PORT}
      JWT_PUBLIC_KEY_PATH: ${JWT_PUBLIC_KEY_PATH}
    volumes:
      - ./secrets/public.pem:${JWT_PUBLIC_KEY_PATH}:ro

volumes:
  auth_postgres_data:
  user_postgres_data:
  account_postgres_data:
  card_postgres_data:
  transaction_postgres_data:
  notification_mongo_data:
