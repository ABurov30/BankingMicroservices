services:
  # Shared infrastructure
  kafka:
    image: apache/kafka:3.7.0
    container_name: kafka
    ports:
      - "${KAFKA_CONTAINER_PORT}:${KAFKA_CONTAINER_PORT}"
      - "${KAFKA_LOCAL_PORT}:${KAFKA_LOCAL_PORT}"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:${KAFKA_CONTROLLER_PORT}"
      KAFKA_LISTENERS: "PLAINTEXT://0.0.0.0:${KAFKA_CONTAINER_PORT},CONTROLLER://0.0.0.0:${KAFKA_CONTROLLER_PORT},PLAINTEXT_HOST://0.0.0.0:${KAFKA_LOCAL_PORT}"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:${KAFKA_CONTAINER_PORT},PLAINTEXT_HOST://localhost:${KAFKA_LOCAL_PORT}"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    ports:
      - "${KAFKA_UI_PORT}:8080"
    depends_on:
      - kafka
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: "kafka:${KAFKA_CONTAINER_PORT}"

  schema-registry:
    image: confluentinc/cp-schema-registry:7.7.10
    container_name: schema-registry
    depends_on:
      - kafka
    ports:
      - "${SCHEMA_REGISTRY_PORT}:8081"
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: "PLAINTEXT://kafka:${KAFKA_CONTAINER_PORT}"
      SCHEMA_REGISTRY_LISTENERS: "http://0.0.0.0:8081"

  jaeger:
    image: cr.jaegertracing.io/jaegertracing/jaeger:2.20.0
    container_name: jaeger
    ports:
      - "16686:16686" # Jaeger UI
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP
      - "5778:5778"
      - "9411:9411"

  # Auth service
  auth-postgres:
    image: postgres:16
    container_name: auth-postgres
    environment:
      POSTGRES_DB: ${AUTH_POSTGRES_DB}
      POSTGRES_USER: ${AUTH_POSTGRES_USER}
      POSTGRES_PASSWORD: ${AUTH_POSTGRES_PASSWORD}
    ports:
      - "${AUTH_POSTGRES_PORT}:5432"
    volumes:
      - auth_postgres_data:/var/lib/postgresql/data

  auth-service:
    image: auth-service:${IMAGE_TAG:-dev}
    build:
      context: ../AuthService
      args:
        GITHUB_TOKEN: ${GITHUB_TOKEN}
        PORT: ${AUTH_PORT}
    container_name: auth-service
    ports:
      - "${AUTH_PORT}:${AUTH_PORT}"
      - "${AUTH_GRPC_PORT}:${AUTH_GRPC_PORT}"
    depends_on:
      - auth-postgres
      - kafka
      - schema-registry
      - jaeger
    environment:
      AUTH_NAME: ${AUTH_NAME}
      AUTH_PORT: ${AUTH_PORT}
      AUTH_GRPC_PORT: ${AUTH_GRPC_PORT}
      SPRING_DATASOURCE_URL: ${AUTH_SPRING_DATASOURCE_URL}
      SPRING_DATASOURCE_USERNAME: ${AUTH_SPRING_DATASOURCE_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${AUTH_SPRING_DATASOURCE_PASSWORD}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS}
      SCHEMA_REGISTRY_URL: ${SCHEMA_REGISTRY_URL}
      JWT_PRIVATE_KEY_PATH: ${JWT_PRIVATE_KEY_PATH}
      JWT_PUBLIC_KEY_PATH: ${JWT_PUBLIC_KEY_PATH}
      TRACING_SAMPLING_PROBABILITY: "1.0"
      OTLP_TRACING_ENDPOINT: http://jaeger:4318/v1/traces
      MANAGEMENT_OTLP_METRICS_EXPORT_ENABLED: "false"
    volumes:
      - ./secrets/private.pem:${JWT_PRIVATE_KEY_PATH}:ro
      - ./secrets/public.pem:${JWT_PUBLIC_KEY_PATH}:ro

  # User service
  user-postgres:
    image: postgres:16
    container_name: user-postgres
    environment:
      POSTGRES_DB: ${USER_POSTGRES_DB}
      POSTGRES_USER: ${USER_POSTGRES_USER}
      POSTGRES_PASSWORD: ${USER_POSTGRES_PASSWORD}
    ports:
      - "${USER_POSTGRES_PORT}:5432"
    volumes:
      - user_postgres_data:/var/lib/postgresql/data

  user-service:
    image: user-service:${IMAGE_TAG:-dev}
    build:
      context: ../UserService
      args:
        GITHUB_TOKEN: ${GITHUB_TOKEN}
        PORT: ${USER_PORT}
    container_name: user-service
    ports:
      - "${USER_PORT}:${USER_PORT}"
      - "${USER_GRPC_PORT}:${USER_GRPC_PORT}"
    depends_on:
      - user-postgres
      - kafka
      - schema-registry
      - jaeger
    environment:
      USER_NAME: ${USER_NAME}
      USER_PORT: ${USER_PORT}
      USER_GRPC_PORT: ${USER_GRPC_PORT}
      SPRING_DATASOURCE_URL: ${USER_SPRING_DATASOURCE_URL}
      SPRING_DATASOURCE_USERNAME: ${USER_SPRING_DATASOURCE_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${USER_SPRING_DATASOURCE_PASSWORD}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS}
      SCHEMA_REGISTRY_URL: ${SCHEMA_REGISTRY_URL}
      TRACING_SAMPLING_PROBABILITY: "1.0"
      OTLP_TRACING_ENDPOINT: http://jaeger:4318/v1/traces
      MANAGEMENT_OTLP_METRICS_EXPORT_ENABLED: "false"

  # Account service
  account-postgres:
    image: postgres:16
    container_name: account-postgres
    environment:
      POSTGRES_DB: ${ACCOUNT_POSTGRES_DB}
      POSTGRES_USER: ${ACCOUNT_POSTGRES_USER}
      POSTGRES_PASSWORD: ${ACCOUNT_POSTGRES_PASSWORD}
    ports:
      - "${ACCOUNT_POSTGRES_PORT}:5432"
    volumes:
      - account_postgres_data:/var/lib/postgresql/data

  account-service:
    image: account-service:${IMAGE_TAG:-dev}
    build:
      context: ../AccountService
      args:
        GITHUB_TOKEN: ${GITHUB_TOKEN}
        PORT: ${ACCOUNT_PORT}
    container_name: account-service
    ports:
      - "${ACCOUNT_PORT}:${ACCOUNT_PORT}"
      - "${ACCOUNT_GRPC_PORT}:${ACCOUNT_GRPC_PORT}"
    depends_on:
      - account-postgres
      - kafka
      - schema-registry
      - jaeger
    environment:
      ACCOUNT_NAME: ${ACCOUNT_NAME}
      ACCOUNT_PORT: ${ACCOUNT_PORT}
      ACCOUNT_GRPC_PORT: ${ACCOUNT_GRPC_PORT}
      SPRING_DATASOURCE_URL: ${ACCOUNT_SPRING_DATASOURCE_URL}
      SPRING_DATASOURCE_USERNAME: ${ACCOUNT_SPRING_DATASOURCE_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${ACCOUNT_SPRING_DATASOURCE_PASSWORD}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS}
      SCHEMA_REGISTRY_URL: ${SCHEMA_REGISTRY_URL}
      TRACING_SAMPLING_PROBABILITY: "1.0"
      OTLP_TRACING_ENDPOINT: http://jaeger:4318/v1/traces
      MANAGEMENT_OTLP_METRICS_EXPORT_ENABLED: "false"

  # Card service
  card-postgres:
    image: postgres:16
    container_name: card-postgres
    environment:
      POSTGRES_DB: ${CARD_POSTGRES_DB}
      POSTGRES_USER: ${CARD_POSTGRES_USER}
      POSTGRES_PASSWORD: ${CARD_POSTGRES_PASSWORD}
    ports:
      - "${CARD_POSTGRES_PORT}:5432"
    volumes:
      - card_postgres_data:/var/lib/postgresql/data

  card-service:
    image: card-service:${IMAGE_TAG:-dev}
    build:
      context: ../CardService
      args:
        GITHUB_TOKEN: ${GITHUB_TOKEN}
        PORT: ${CARD_PORT}
    container_name: card-service
    ports:
      - "${CARD_PORT}:${CARD_PORT}"
      - "${CARD_GRPC_PORT}:${CARD_GRPC_PORT}"
    depends_on:
      - card-postgres
      - kafka
      - schema-registry
      - jaeger
    environment:
      CARD_NAME: ${CARD_NAME}
      CARD_PORT: ${CARD_PORT}
      CARD_GRPC_PORT: ${CARD_GRPC_PORT}
      SPRING_DATASOURCE_URL: ${CARD_SPRING_DATASOURCE_URL}
      SPRING_DATASOURCE_USERNAME: ${CARD_SPRING_DATASOURCE_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${CARD_SPRING_DATASOURCE_PASSWORD}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS}
      SCHEMA_REGISTRY_URL: ${SCHEMA_REGISTRY_URL}
      TRACING_SAMPLING_PROBABILITY: "1.0"
      OTLP_TRACING_ENDPOINT: http://jaeger:4318/v1/traces
      MANAGEMENT_OTLP_METRICS_EXPORT_ENABLED: "false"

  # Transaction service
  transaction-postgres:
    image: postgres:16
    container_name: transaction-postgres
    environment:
      POSTGRES_DB: ${TRANSACTION_POSTGRES_DB}
      POSTGRES_USER: ${TRANSACTION_POSTGRES_USER}
      POSTGRES_PASSWORD: ${TRANSACTION_POSTGRES_PASSWORD}
    ports:
      - "${TRANSACTION_POSTGRES_PORT}:5432"
    volumes:
      - transaction_postgres_data:/var/lib/postgresql/data

  transaction-service:
    image: transaction-service:${IMAGE_TAG:-dev}
    build:
      context: ../TransactionService
      args:
        GITHUB_TOKEN: ${GITHUB_TOKEN}
        PORT: ${TRANSACTION_PORT}
    container_name: transaction-service
    ports:
      - "${TRANSACTION_PORT}:${TRANSACTION_PORT}"
      - "${TRANSACTION_GRPC_PORT}:${TRANSACTION_GRPC_PORT}"
    depends_on:
      - transaction-postgres
      - kafka
      - schema-registry
      - jaeger
    environment:
      TRANSACTION_NAME: ${TRANSACTION_NAME}
      TRANSACTION_PORT: ${TRANSACTION_PORT}
      TRANSACTION_GRPC_PORT: ${TRANSACTION_GRPC_PORT}
      ACCOUNT_GRPC_HOST: ${ACCOUNT_GRPC_HOST}
      ACCOUNT_GRPC_PORT: ${ACCOUNT_GRPC_PORT}
      SPRING_DATASOURCE_URL: ${TRANSACTION_SPRING_DATASOURCE_URL}
      SPRING_DATASOURCE_USERNAME: ${TRANSACTION_SPRING_DATASOURCE_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${TRANSACTION_SPRING_DATASOURCE_PASSWORD}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS}
      SCHEMA_REGISTRY_URL: ${SCHEMA_REGISTRY_URL}
      TRACING_SAMPLING_PROBABILITY: "1.0"
      OTLP_TRACING_ENDPOINT: http://jaeger:4318/v1/traces
      MANAGEMENT_OTLP_METRICS_EXPORT_ENABLED: "false"

  # Notification service
  notification-mongodb:
    image: mongo:7
    container_name: notification-mongodb
    environment:
      MONGO_INITDB_DATABASE: ${NOTIFICATION_MONGO_DB}
      MONGO_INITDB_ROOT_USERNAME: ${NOTIFICATION_MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${NOTIFICATION_MONGO_PASSWORD}
    ports:
      - "${NOTIFICATION_MONGO_PORT}:27017"
    volumes:
      - notification_mongo_data:/data/db

  notification-postgres:
    image: postgres:16
    container_name: notification-postgres
    environment:
      POSTGRES_DB: ${NOTIFICATION_POSTGRES_DB}
      POSTGRES_USER: ${NOTIFICATION_POSTGRES_USER}
      POSTGRES_PASSWORD: ${NOTIFICATION_POSTGRES_PASSWORD}
    ports:
      - "${NOTIFICATION_POSTGRES_PORT}:5432"
    volumes:
      - notification_postgres_data:/var/lib/postgresql/data

  notification-service:
    image: notification-service:${IMAGE_TAG:-dev}
    build:
      context: ../NotificationService
      args:
        GITHUB_TOKEN: ${GITHUB_TOKEN}
        PORT: ${NOTIFICATION_PORT}
    container_name: notification-service
    ports:
      - "${NOTIFICATION_PORT}:${NOTIFICATION_PORT}"
      - "${NOTIFICATION_GRPC_PORT}:${NOTIFICATION_GRPC_PORT}"
    depends_on:
      - notification-mongodb
      - notification-postgres
      - kafka
      - schema-registry
      - jaeger
    environment:
      NOTIFICATION_NAME: ${NOTIFICATION_NAME}
      NOTIFICATION_PORT: ${NOTIFICATION_PORT}
      NOTIFICATION_GRPC_PORT: ${NOTIFICATION_GRPC_PORT}
      SITE_URL: ${SITE_URL}
      NOTIFICATION_SPRING_DATASOURCE_URL: ${NOTIFICATION_SPRING_DATASOURCE_URL}
      NOTIFICATION_SPRING_DATASOURCE_USERNAME: ${NOTIFICATION_SPRING_DATASOURCE_USERNAME}
      NOTIFICATION_SPRING_DATASOURCE_PASSWORD: ${NOTIFICATION_SPRING_DATASOURCE_PASSWORD}
      NOTIFICATION_MONGO_URI: ${NOTIFICATION_MONGO_URI}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS}
      SCHEMA_REGISTRY_URL: ${SCHEMA_REGISTRY_URL}
      MAIL_HOST: ${MAIL_HOST}
      MAIL_PORT: ${MAIL_PORT}
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      TRACING_SAMPLING_PROBABILITY: "1.0"
      OTLP_TRACING_ENDPOINT: http://jaeger:4318/v1/traces
      MANAGEMENT_OTLP_METRICS_EXPORT_ENABLED: "false"

  # API gateway
  api-gateway:
    image: api-gateway:${IMAGE_TAG:-dev}
    build:
      context: ../ApiGateway
      args:
        GITHUB_TOKEN: ${GITHUB_TOKEN}
        PORT: ${API_GATEWAY_PORT}
    container_name: api-gateway
    ports:
      - "${API_GATEWAY_PORT}:${API_GATEWAY_PORT}"
    depends_on:
      - auth-service
      - user-service
      - account-service
      - card-service
      - transaction-service
      - notification-service
      - jaeger
    environment:
      API_GATEWAY_NAME: ${API_GATEWAY_NAME}
      API_GATEWAY_PORT: ${API_GATEWAY_PORT}
      AUTH_GRPC_HOST: ${AUTH_GRPC_HOST}
      AUTH_GRPC_PORT: ${AUTH_GRPC_PORT}
      USER_GRPC_HOST: ${USER_GRPC_HOST}
      USER_GRPC_PORT: ${USER_GRPC_PORT}
      ACCOUNT_GRPC_HOST: ${ACCOUNT_GRPC_HOST}
      ACCOUNT_GRPC_PORT: ${ACCOUNT_GRPC_PORT}
      CARD_GRPC_HOST: ${CARD_GRPC_HOST}
      CARD_GRPC_PORT: ${CARD_GRPC_PORT}
      TRANSACTION_GRPC_HOST: ${TRANSACTION_GRPC_HOST}
      TRANSACTION_GRPC_PORT: ${TRANSACTION_GRPC_PORT}
      NOTIFICATION_GRPC_HOST: ${NOTIFICATION_GRPC_HOST}
      NOTIFICATION_GRPC_PORT: ${NOTIFICATION_GRPC_PORT}
      NOTIFICATION_PORT: ${NOTIFICATION_PORT}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS}
      SCHEMA_REGISTRY_URL: ${SCHEMA_REGISTRY_URL}
      JWT_PUBLIC_KEY_PATH: ${JWT_PUBLIC_KEY_PATH}
      TRACING_SAMPLING_PROBABILITY: "1.0"
      OTLP_TRACING_ENDPOINT: http://jaeger:4318/v1/traces
      MANAGEMENT_OTLP_METRICS_EXPORT_ENABLED: "false"
    volumes:
      - ./secrets/public.pem:${JWT_PUBLIC_KEY_PATH}:ro

  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    depends_on:
      - api-gateway
      - auth-service
      - user-service
      - account-service
      - card-service
      - transaction-service
      - notification-service

  grafana:
    image: grafana/grafana:11.4.0
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GF_SECURITY_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./observability/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./observability/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
      - loki
      - jaeger

  loki:
    image: grafana/loki:3.7.0
    container_name: loki
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/loki-config.yaml
    volumes:
      - ./observability/loki/loki-config.yaml:/etc/loki/loki-config.yaml:ro
      - loki_data:/loki

  alloy:
    image: grafana/alloy:latest
    container_name: alloy
    ports:
      - "12345:12345"
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - /etc/alloy/config.alloy
    volumes:
      - ./observability/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - loki

volumes:
  auth_postgres_data:
  user_postgres_data:
  account_postgres_data:
  card_postgres_data:
  transaction_postgres_data:
  notification_mongo_data:
  notification_postgres_data:
  prometheus_data:
  grafana_data:
  loki_data:
