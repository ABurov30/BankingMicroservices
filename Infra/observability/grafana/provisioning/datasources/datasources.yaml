apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    uid: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: true

  - name: Loki
    type: loki
    uid: loki
    access: proxy
    url: http://loki:3100
    jsonData:
      derivedFields:
        - name: traceId
          matcherRegex: '\[[^,]+,([a-fA-F0-9]{16,32}),[a-fA-F0-9]{16,32}\]'
          datasourceUid: jaeger
          url: '$${__value.raw}'
    editable: true

  - name: Jaeger
    type: jaeger
    uid: jaeger
    access: proxy
    url: http://jaeger:16686
    jsonData:
      tracesToLogsV2:
        datasourceUid: loki
        spanStartTimeShift: '-5m'
        spanEndTimeShift: '5m'
        tags:
          - key: service.name
            value: service
          - key: k8s.pod.name
            value: pod
          - key: container
        filterByTraceID: true
        filterBySpanID: false
      nodeGraph:
        enabled: true
      spanBar:
        type: Duration
    editable: true
