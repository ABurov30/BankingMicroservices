name: Push to main branch

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    name: Test ${{ matrix.service }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - service: notification-service
            path: NotificationService
            db_type: mongo
            db_config: { DB_VAR: NOTIFICATION_MONGO_DB, USER_VAR: NOTIFICATION_MONGO_USER, PASSWORD_SECRET: NOTIFICATION_MONGO_PASSWORD, CONTAINER_NAME: 'notification-mongodb' }
          - service: user-service
            path: UserService
            db_type: postgres
            db_config: { DB_VAR: USER_POSTGRES_DB, USER_VAR: USER_POSTGRES_USER, PASSWORD_SECRET: USER_POSTGRES_PASSWORD, CONTAINER_NAME: 'user-postgres' }
          - service: transaction-service
            path: TransactionService
            db_type: postgres
            db_config: { DB_VAR: TRANSACTION_POSTGRES_DB, USER_VAR: TRANSACTION_POSTGRES_USER, PASSWORD_SECRET: TRANSACTION_POSTGRES_PASSWORD, CONTAINER_NAME: 'transaction-postgres' }
          - service: card-service
            path: CardService
            db_type: postgres
            db_config: { DB_VAR: CARD_POSTGRES_DB, USER_VAR: CARD_POSTGRES_USER, PASSWORD_SECRET: CARD_POSTGRES_PASSWORD, CONTAINER_NAME: 'card-postgres' }
          - service: account-service
            path: AccountService
            db_type: postgres
            db_config: { DB_VAR: ACCOUNT_POSTGRES_DB, USER_VAR: ACCOUNT_POSTGRES_USER, PASSWORD_SECRET: ACCOUNT_POSTGRES_PASSWORD, CONTAINER_NAME: 'account-postgres' }
          - service: auth-service
            path: AuthService
            db_type: postgres
            db_config: { DB_VAR: AUTH_POSTGRES_DB, USER_VAR: AUTH_POSTGRES_USER, PASSWORD_SECRET: AUTH_POSTGRES_PASSWORD, CONTAINER_NAME: 'auth-postgres' }
          - service: api-gateway
            path: ApiGateway
            db_type: none


    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: Start PostgreSQL
        if: matrix.db_type == 'postgres'
        run: |
          docker run -d \
            --name ${{ matrix.db_config.CONTAINER_NAME }} \
            -e POSTGRES_DB=${{ vars[matrix.db_config.DB_VAR] }} \
            -e POSTGRES_USER=${{ vars[matrix.db_config.USER_VAR] }} \
            -e POSTGRES_PASSWORD=${{ secrets[matrix.db_config.PASSWORD_SECRET] }} \
            -p 5432:5432 \
            postgres:16

      - name: Wait for PostgreSQL
        if: matrix.db_type == 'postgres'
        run: |
          for i in {1..30}; do
            docker exec ${{ matrix.db_config.CONTAINER_NAME }} pg_isready \
              -U ${{ vars[matrix.db_config.USER_VAR] }} \
              -d ${{ vars[matrix.db_config.DB_VAR] }} && exit 0
            sleep 2
          done
          docker logs ${{ matrix.db_config.CONTAINER_NAME }}
          exit 1

      - name: Start MongoDB
        if: matrix.db_type == 'mongo'
        run: |
          docker run -d \
            --name ${{ matrix.db_config.CONTAINER_NAME }} \
            -e MONGO_INITDB_DATABASE=${{ vars[matrix.db_config.DB_VAR] }} \
            -e MONGO_INITDB_ROOT_USERNAME=${{ vars[matrix.db_config.USER_VAR] }} \
            -e MONGO_INITDB_ROOT_PASSWORD=${{ secrets[matrix.db_config.PASSWORD_SECRET] }} \
            -p 27017:27017 \
            mongo:7

      - name: Wait for MongoDB
        if: matrix.db_type == 'mongo'
        run: |
          for i in {1..30}; do
            docker exec ${{ matrix.db_config.CONTAINER_NAME }} mongosh \
              --quiet \
              --username ${{ vars[matrix.db_config.USER_VAR] }} \
              --password ${{ secrets[matrix.db_config.PASSWORD_SECRET] }} \
              --authenticationDatabase admin \
              --eval "db.adminCommand('ping').ok" | grep 1 && exit 0
          
            sleep 2
          done
          
          docker logs ${{ matrix.db_config.CONTAINER_NAME }}
          exit 1

      - name: Run tests
        working-directory: ${{ matrix.path }}
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN }}

          API_GATEWAY_NAME: ${{ vars.API_GATEWAY_NAME }}
          API_GATEWAY_PORT: ${{ vars.API_GATEWAY_PORT }}

          AUTH_NAME: ${{ vars.AUTH_NAME }}
          AUTH_PORT: ${{ vars.AUTH_PORT }}
          AUTH_GRPC_HOST: ${{ vars.AUTH_GRPC_HOST }}
          AUTH_GRPC_PORT: ${{ vars.AUTH_GRPC_PORT }}
          AUTH_SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/${{ vars.AUTH_POSTGRES_DB }}
          AUTH_SPRING_DATASOURCE_USERNAME: ${{ vars.AUTH_SPRING_DATASOURCE_USERNAME }}
          AUTH_SPRING_DATASOURCE_PASSWORD: ${{ secrets.AUTH_SPRING_DATASOURCE_PASSWORD }}
          AUTH_POSTGRES_DB: ${{ vars.AUTH_POSTGRES_DB }}
          AUTH_POSTGRES_USER: ${{ vars.AUTH_POSTGRES_USER }}
          AUTH_POSTGRES_PASSWORD: ${{ secrets.AUTH_POSTGRES_PASSWORD }}

          USER_NAME: ${{ vars.USER_NAME }}
          USER_PORT: ${{ vars.USER_PORT }}
          USER_GRPC_HOST: ${{ vars.USER_GRPC_HOST }}
          USER_GRPC_PORT: ${{ vars.USER_GRPC_PORT }}
          USER_SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/${{ vars.USER_POSTGRES_DB }}
          USER_SPRING_DATASOURCE_USERNAME: ${{ vars.USER_SPRING_DATASOURCE_USERNAME }}
          USER_SPRING_DATASOURCE_PASSWORD: ${{ secrets.USER_SPRING_DATASOURCE_PASSWORD }}
          USER_POSTGRES_DB: ${{ vars.USER_POSTGRES_DB }}
          USER_POSTGRES_USER: ${{ vars.USER_POSTGRES_USER }}
          USER_POSTGRES_PASSWORD: ${{ secrets.USER_POSTGRES_PASSWORD }}

          ACCOUNT_NAME: ${{ vars.ACCOUNT_NAME }}
          ACCOUNT_PORT: ${{ vars.ACCOUNT_PORT }}
          ACCOUNT_GRPC_HOST: ${{ vars.ACCOUNT_GRPC_HOST }}
          ACCOUNT_GRPC_PORT: ${{ vars.ACCOUNT_GRPC_PORT }}
          ACCOUNT_SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/${{ vars.ACCOUNT_POSTGRES_DB }}
          ACCOUNT_SPRING_DATASOURCE_USERNAME: ${{ vars.ACCOUNT_SPRING_DATASOURCE_USERNAME }}
          ACCOUNT_SPRING_DATASOURCE_PASSWORD: ${{ secrets.ACCOUNT_SPRING_DATASOURCE_PASSWORD }}
          ACCOUNT_POSTGRES_DB: ${{ vars.ACCOUNT_POSTGRES_DB }}
          ACCOUNT_POSTGRES_USER: ${{ vars.ACCOUNT_POSTGRES_USER }}
          ACCOUNT_POSTGRES_PASSWORD: ${{ secrets.ACCOUNT_POSTGRES_PASSWORD }}

          CARD_NAME: ${{ vars.CARD_NAME }}
          CARD_PORT: ${{ vars.CARD_PORT }}
          CARD_GRPC_HOST: ${{ vars.CARD_GRPC_HOST }}
          CARD_GRPC_PORT: ${{ vars.CARD_GRPC_PORT }}
          CARD_SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/${{ vars.CARD_POSTGRES_DB }}
          CARD_SPRING_DATASOURCE_USERNAME: ${{ vars.CARD_SPRING_DATASOURCE_USERNAME }}
          CARD_SPRING_DATASOURCE_PASSWORD: ${{ secrets.CARD_SPRING_DATASOURCE_PASSWORD }}
          CARD_POSTGRES_DB: ${{ vars.CARD_POSTGRES_DB }}
          CARD_POSTGRES_USER: ${{ vars.CARD_POSTGRES_USER }}
          CARD_POSTGRES_PASSWORD: ${{ secrets.CARD_POSTGRES_PASSWORD }}

          TRANSACTION_NAME: ${{ vars.TRANSACTION_NAME }}
          TRANSACTION_PORT: ${{ vars.TRANSACTION_PORT }}
          TRANSACTION_GRPC_HOST: ${{ vars.TRANSACTION_GRPC_HOST }}
          TRANSACTION_GRPC_PORT: ${{ vars.TRANSACTION_GRPC_PORT }}
          TRANSACTION_SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/${{ vars.TRANSACTION_POSTGRES_DB }}
          TRANSACTION_SPRING_DATASOURCE_USERNAME: ${{ vars.TRANSACTION_SPRING_DATASOURCE_USERNAME }}
          TRANSACTION_SPRING_DATASOURCE_PASSWORD: ${{ secrets.TRANSACTION_SPRING_DATASOURCE_PASSWORD }}
          TRANSACTION_POSTGRES_DB: ${{ vars.TRANSACTION_POSTGRES_DB }}
          TRANSACTION_POSTGRES_USER: ${{ vars.TRANSACTION_POSTGRES_USER }}
          TRANSACTION_POSTGRES_PASSWORD: ${{ secrets.TRANSACTION_POSTGRES_PASSWORD }}

          NOTIFICATION_NAME: ${{ vars.NOTIFICATION_NAME }}
          NOTIFICATION_PORT: ${{ vars.NOTIFICATION_PORT }}
          NOTIFICATION_GRPC_PORT: ${{ vars.NOTIFICATION_GRPC_PORT }}
          NOTIFICATION_MONGO_HOST: localhost
          NOTIFICATION_MONGO_PORT: 27017
          NOTIFICATION_MONGO_DB: ${{ vars.NOTIFICATION_MONGO_DB }}
          NOTIFICATION_MONGO_USER: ${{ vars.NOTIFICATION_MONGO_USER }}
          NOTIFICATION_MONGO_PASSWORD: ${{ secrets.NOTIFICATION_MONGO_PASSWORD }}
        run: mvn -s .mvn/settings-docker.xml test

      - name: Print test reports
        if: failure()
        working-directory: ${{ matrix.path }}
        run: cat target/surefire-reports/*.txt

      - name: Stop database
        if: always() && matrix.db_type != 'none'
        run: docker rm -f ${{ matrix.db_config.CONTAINER_NAME }}

  build:
    name: Build Docker Compose
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Start Docker Compose
        working-directory: Infra
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN }}
          API_GATEWAY_NAME: ${{ vars.API_GATEWAY_NAME }}
          API_GATEWAY_PORT: ${{ vars.API_GATEWAY_PORT }}
          AUTH_NAME: ${{ vars.AUTH_NAME }}
          AUTH_PORT: ${{ vars.AUTH_PORT }}
          AUTH_GRPC_HOST: ${{ vars.AUTH_GRPC_HOST }}
          AUTH_GRPC_PORT: ${{ vars.AUTH_GRPC_PORT }}
          AUTH_SPRING_DATASOURCE_URL: ${{ vars.AUTH_SPRING_DATASOURCE_URL }}
          AUTH_SPRING_DATASOURCE_USERNAME: ${{ vars.AUTH_SPRING_DATASOURCE_USERNAME }}
          AUTH_SPRING_DATASOURCE_PASSWORD: ${{ secrets.AUTH_SPRING_DATASOURCE_PASSWORD }}
          AUTH_POSTGRES_DB: ${{ vars.AUTH_POSTGRES_DB }}
          AUTH_POSTGRES_USER: ${{ vars.AUTH_POSTGRES_USER }}
          AUTH_POSTGRES_PASSWORD: ${{ secrets.AUTH_POSTGRES_PASSWORD }}
        run: docker compose up --build -d

      - name: Show Docker Compose status
        working-directory: Infra
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN }}
          API_GATEWAY_NAME: ${{ vars.API_GATEWAY_NAME }}
          API_GATEWAY_PORT: ${{ vars.API_GATEWAY_PORT }}
          AUTH_NAME: ${{ vars.AUTH_NAME }}
          AUTH_PORT: ${{ vars.AUTH_PORT }}
          AUTH_GRPC_HOST: ${{ vars.AUTH_GRPC_HOST }}
          AUTH_GRPC_PORT: ${{ vars.AUTH_GRPC_PORT }}
          AUTH_SPRING_DATASOURCE_URL: ${{ vars.AUTH_SPRING_DATASOURCE_URL }}
          AUTH_SPRING_DATASOURCE_USERNAME: ${{ vars.AUTH_SPRING_DATASOURCE_USERNAME }}
          AUTH_SPRING_DATASOURCE_PASSWORD: ${{ secrets.AUTH_SPRING_DATASOURCE_PASSWORD }}
          AUTH_POSTGRES_DB: ${{ vars.AUTH_POSTGRES_DB }}
          AUTH_POSTGRES_USER: ${{ vars.AUTH_POSTGRES_USER }}
          AUTH_POSTGRES_PASSWORD: ${{ secrets.AUTH_POSTGRES_PASSWORD }}
        run: docker compose ps

      - name: Stop Docker Compose
        if: always()
        working-directory: Infra
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN }}
          API_GATEWAY_NAME: ${{ vars.API_GATEWAY_NAME }}
          API_GATEWAY_PORT: ${{ vars.API_GATEWAY_PORT }}
          AUTH_NAME: ${{ vars.AUTH_NAME }}
          AUTH_PORT: ${{ vars.AUTH_PORT }}
          AUTH_GRPC_HOST: ${{ vars.AUTH_GRPC_HOST }}
          AUTH_GRPC_PORT: ${{ vars.AUTH_GRPC_PORT }}
          AUTH_SPRING_DATASOURCE_URL: ${{ vars.AUTH_SPRING_DATASOURCE_URL }}
          AUTH_SPRING_DATASOURCE_USERNAME: ${{ vars.AUTH_SPRING_DATASOURCE_USERNAME }}
          AUTH_SPRING_DATASOURCE_PASSWORD: ${{ secrets.AUTH_SPRING_DATASOURCE_PASSWORD }}
          AUTH_POSTGRES_DB: ${{ vars.AUTH_POSTGRES_DB }}
          AUTH_POSTGRES_USER: ${{ vars.AUTH_POSTGRES_USER }}
          AUTH_POSTGRES_PASSWORD: ${{ secrets.AUTH_POSTGRES_PASSWORD }}
        run: docker compose down -v
